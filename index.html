<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VectorPulse Studio — 智能图片转 SVG & 动态矢量工坊</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>Vector<b>Pulse</b> Studio</h1>
    <span>光迹矢量工坊 · 图片转 SVG 与动态过程生成</span>
  </div>
  <div class="header-badges">
    <span class="badge">VTracer WASM 离线核心</span>
    <span class="badge">免环境 · 双击即用</span>
  </div>
</header>

<div class="layout">
  <aside>
    <!-- 预设选择 -->
    <div class="sec">
      <h2>快速预设配置</h2>
      <select id="presetSelect">
        <option value="custom">⚙️ 自定义参数</option>
        <option value="balanced" selected>⚖️ 默认平衡 (通用插画)</option>
        <option value="logo">📐 极简图标 / Logo (平整色块)</option>
        <option value="anime">🎨 高保真动漫 / 绘本</option>
        <option value="photo">📷 摄影人像 (平滑噪点)</option>
        <option value="lineart">✒️ 黑白线稿 / 钢笔速写</option>
      </select>
      <div class="hint">新手推荐直接选择预设，也可在下方微调。</div>
    </div>

    <!-- 描摹参数 -->
    <div class="sec">
      <h2>描摹精细度</h2>
      <div class="row">
        <label>图层结构</label>
        <select id="hier">
          <option value="stacked">stacked 叠层 (推荐)</option>
          <option value="cutout">cutout 挖剪拼版</option>
        </select>
      </div>
      <div class="row">
        <label>拟合曲线</label>
        <select id="mode">
          <option value="spline">spline 平滑样条</option>
          <option value="polygon">polygon 几何折线</option>
          <option value="none">none 像素硬边</option>
        </select>
      </div>
      <div class="row">
        <label>颜色丰富度</label>
        <input type="range" id="cp" min="1" max="10" value="7">
        <span class="val" id="cpv">7</span>
      </div>
      <div class="row">
        <label>杂斑过滤</label>
        <input type="range" id="fs" min="0" max="30" value="4">
        <span class="val" id="fsv">4</span>
      </div>
      <div class="row">
        <label>色阶跨度</label>
        <input type="range" id="ld" min="2" max="64" value="16">
        <span class="val" id="ldv">16</span>
      </div>
      <div class="row">
        <label>超采样倍率</label>
        <select id="upscale">
          <option value="1">1× 原像素</option>
          <option value="2" selected>2× 双倍精细</option>
          <option value="4">4× 极致精细 (小图推荐)</option>
        </select>
      </div>
    </div>

    <!-- 动效配置 -->
    <div class="sec">
      <h2>动效编排</h2>
      <div class="row">
        <label>动效风格</label>
        <select id="animStyle">
          <option value="paint">手绘涂装 (铅笔稿+逐层上色)</option>
          <option value="bloom">水彩层叠绽放 (Watercolor)</option>
          <option value="beam">极光扫描揭幕 (Cyber Beam)</option>
        </select>
      </div>
      <div class="row">
        <label>动画层数</label>
        <input type="range" id="layers" min="6" max="80" value="36">
        <span class="val" id="layersv">36</span>
      </div>
      <div class="row">
        <label>图层节拍 (s)</label>
        <input type="range" id="stagger" min="3" max="35" value="14">
        <span class="val" id="staggerv">.14</span>
      </div>
      <div class="check">
        <input type="checkbox" id="sketch" checked>
        <label for="sketch">开启铅笔素描铺底阶段</label>
      </div>
    </div>

    <!-- 导出选项 -->
    <div class="sec">
      <h2>导出格式</h2>
      <div class="row">
        <label>PNG 缩放倍率</label>
        <select id="pngscale">
          <option value="1">1×</option>
          <option value="2" selected>2× (Retina)</option>
          <option value="4">4× (印刷高清)</option>
        </select>
      </div>
      <div class="btns col">
        <button class="bt" id="dlsvg" disabled>⬇ 导出标准 SVG</button>
        <button class="bt" id="dlpng" disabled>⬇ 导出高清 PNG</button>
        <button class="bt" id="dlstatic" disabled>⬇ 导出静态单页 HTML</button>
        <button class="bt primary" id="dlanim" disabled>🚀 导出独立动画 HTML</button>
        <button class="bt sub" id="btnViewCode" disabled>📋 查看 SVG 源码</button>
      </div>
    </div>
  </aside>

  <main>
    <!-- 上传区 -->
    <div class="drop" id="drop">
      拖拽图片到这里，或 <b>点击选择文件</b>（PNG, JPG, WebP, BMP）<br>
      <span style="font-size:12px;opacity:.8">支持直接使用 <kbd>Ctrl + V</kbd> 粘贴剪贴板截图</span>
      <input type="file" id="file" accept="image/*" hidden>
    </div>

    <!-- 状态芯片 -->
    <div class="stats" id="stats" hidden></div>

    <!-- 视图模式切换 -->
    <div class="view-tabs" id="viewTabs" hidden>
      <button class="tab-btn active" data-view="split">对比卷帘视图</button>
      <button class="tab-btn" data-view="side">左右并排视图</button>
      <button class="tab-btn" data-view="svg">单屏纯净视图</button>
    </div>

    <!-- 画布区 -->
    <div class="stage-wrapper" id="stageWrap" hidden>
      <!-- 卷帘对比视图 -->
      <div id="diffBox" class="diff-container">
        <div class="diff-layer diff-before">
          <canvas id="diffCv"></canvas>
          <span class="tag">原图</span>
        </div>
        <div class="diff-layer diff-after" id="diffSvgWrap">
          <div id="diffSvg" style="width:100%;height:100%;"></div>
          <span class="tag right">SVG 描摹</span>
        </div>
        <div class="diff-divider" id="diffDivider">
          <div class="diff-handle">↔</div>
        </div>
        <input type="range" class="diff-slider-input" id="diffRange" min="0" max="100" value="50">
      </div>

      <!-- 左右并排视图 -->
      <div id="sideWrap" class="side-wrap" hidden>
        <div>
          <div class="pv-box" id="pvSrc"><canvas id="cvSrc"></canvas><span class="tag">原图</span></div>
        </div>
        <div>
          <div class="pv-box" id="pvOut"><span class="tag" id="pvOutTag">SVG</span></div>
        </div>
      </div>

      <!-- 动效播放控制器 -->
      <div class="anim-bar-wrap" id="animControls">
        <button class="ctrl-icon-btn" id="btnPlayPause" title="播放 / 暂停">
          <svg id="playIcon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="pauseIcon" width="16" height="16" fill="currentColor" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-icon-btn" id="btnReplay" title="从头播放">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
        <div class="anim-progress"><div class="anim-progress-inner" id="progressBar"></div></div>
        <select id="animSpeed">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1.0x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2.0x</option>
        </select>
        <label class="check" style="font-size:11px"><input type="checkbox" id="animLoop">循环</label>
      </div>
    </div>

    <div class="btns">
      <button class="bt primary" id="retrace" disabled>↻ 重新描摹</button>
      <button class="bt" id="replay" disabled>▶ 播放动效</button>
    </div>

    <div id="log"></div>
  </main>
</div>

<!-- SVG 代码弹窗 -->
<div class="modal-mask" id="codeModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>SVG 源码检查与快速复制</h3>
      <button class="ctrl-icon-btn" id="closeCodeModal">✕</button>
    </div>
    <div class="modal-body">
      <textarea id="svgCodeArea" readonly spellcheck="false"></textarea>
    </div>
    <div class="modal-foot">
      <button class="bt" id="copySvgCode">复制 SVG 代码</button>
      <button class="bt" id="copySvgDataUri">复制 Data URI</button>
    </div>
  </div>
</div>

<!-- 按依赖顺序通过原生 script 引入，避免 file:// CORS 限制 -->
<script src="vtracer.js"></script>
<script src="app.js"></script>
</body>
</html>
